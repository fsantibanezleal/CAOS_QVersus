name: CI

# ADR-0074: cheap checks only, trunk-only triggers, a concurrency group, a timeout on every job.
on:
  push:
    branches: [main, develop]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install with the dev extra (every simulator framework)
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check qversus tests
      - name: Tests
        run: pytest

  core-deps:
    # The package claims a NumPy-only core, and a claim in a README is not a guarantee. This job installs
    # WITHOUT extras and asserts both halves: the declared runtime dependencies are NumPy alone, and the
    # catalogue, the registry and a classical solver work under that install.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core only
        run: pip install .
      - name: The core really is NumPy, and the catalogue loads
        run: |
          cd /tmp   # import the INSTALLED package, never the source tree next to it
          python - <<'PY'
          import importlib.metadata as md
          import warnings

          hard = sorted(d.split(">=")[0] for d in (md.requires("qversus") or []) if "extra ==" not in d)
          assert hard == ["numpy"], f"unexpected core dependencies: {hard}"

          import qversus
          with warnings.catch_warnings():
              warnings.simplefilter("ignore")   # the framework adapters warn that their framework is absent
              from qversus.registry import all_problems, get_problem, solvers_for
              assert len(all_problems()) == 20, sorted(all_problems())
              problem = get_problem("grover")
              classical = [s for s in solvers_for(problem) if s.paradigm == "classical"]
          result = classical[0].run(problem, problem.instance("grover-4-10"), seed=42, shots=1)
          assert result.value["correct"] is True, result.value
          print(f"OK: qversus {qversus.__version__}, NumPy-only core, 20 problems, a classical solver ran")
          PY

  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Base-integrity guards
        run: |
          fail=0
          if git ls-files | grep -qE '(^|/)\.env(\..+)?$'; then
            echo "::error::a real .env is tracked"; fail=1; fi
          if git ls-files | grep -qiE '(^|/)\.?venv|\.(dll|so|dylib|pt|pth)$'; then
            echo "::error::a venv or native binary is tracked"; fail=1; fi
          if git grep -nE 'D:\\_Repos|C:\\Users\\|C:/Users/' -- . ':!.github' >/dev/null 2>&1; then
            echo "::error::leaked local machine path in a tracked file"; fail=1; fi
          # This repository exists because a product must not declare its own package. It must never grow an
          # internal one either.
          if git ls-files | grep -qE '(^|/)[a-z_]+lab/'; then
            echo "::error::an internal lab package appeared"; fail=1; fi
          if [ "$fail" -eq 0 ]; then echo "guards: OK"; fi
          exit $fail
      - name: No em-dash and no emoji in tracked content (ADR-0067)
        run: python3 scripts/check_content_standards.py
      - name: CI budget, trunk-only triggers, no training (ADR-0074)
        run: python3 scripts/check_ci_budget.py
      - name: Version coherence, VERSION == pyproject == CHANGELOG == __version__
        run: |
          python3 - <<'PY'
          import pathlib, re

          def norm(v):
              m = re.match(r"^v?(\d+)\.(\d+)\.(\d+)", v.strip())
              assert m, f"unparseable version {v!r}"
              return tuple(int(g) for g in m.groups())

          seen = {
              "VERSION": pathlib.Path("VERSION").read_text().strip(),
              "pyproject": re.search(r'^version\s*=\s*"([^"]+)"',
                                     pathlib.Path("pyproject.toml").read_text(), re.M).group(1),
              "CHANGELOG": re.search(r"^## \[([^\]]+)\]",
                                     pathlib.Path("CHANGELOG.md").read_text(), re.M).group(1),
              "__version__": re.search(r'^__version__\s*=\s*"([^"]+)"',
                                       pathlib.Path("qversus/__init__.py").read_text(), re.M).group(1),
          }
          assert len({norm(v) for v in seen.values()}) == 1, f"version drift: {seen}"
          print(f"OK: {seen['VERSION']} (manifest {seen['pyproject']})")
          PY
